services:

  ingestion_gateway:
    build:
      context: ./ingestion_gateway
      dockerfile: Dockerfile
    container_name: soar_ingestion_gateway
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment: &ingestion_environment
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      SOAR_TENANT_ID: ${SOAR_TENANT_ID:-lab}
      INGESTION_API_TOKEN: ${INGESTION_API_TOKEN:-}
      CHECKPOINT_DB: /app/data/checkpoints.sqlite3
    ports:
      - "8090:8080"
    volumes:
      - ./runtime/ingestion:/app/data
    networks:
      - socdss_net
    restart: unless-stopped

  normalizer_worker:
    build:
      context: ./ingestion_gateway
      dockerfile: Dockerfile
    container_name: soar_normalizer_worker
    command: ["python", "-u", "-m", "app.worker"]
    environment: *ingestion_environment
    networks:
      - socdss_net
    restart: unless-stopped

  syslog_receiver:
    build:
      context: ./ingestion_gateway
      dockerfile: Dockerfile
    container_name: soar_syslog_receiver
    command: ["python", "-u", "-m", "app.syslog_receiver"]
    environment:
      <<: *ingestion_environment
      SYSLOG_SOURCE_PRODUCT: ${SYSLOG_SOURCE_PRODUCT:-generic_syslog}
      SYSLOG_PORT: 5514
    ports:
      - "5514:5514/tcp"
      - "5514:5514/udp"
    networks:
      - socdss_net
    restart: unless-stopped

  wazuh_poller:
    profiles: ["wazuh"]
    build:
      context: ./ingestion_gateway
      dockerfile: Dockerfile
    container_name: soar_wazuh_poller
    command: ["python", "-u", "-m", "app.wazuh_poller"]
    environment:
      <<: *ingestion_environment
      WAZUH_INDEXER_URL: ${WAZUH_INDEXER_URL:-https://wazuh.indexer:9200}
      WAZUH_INDEXER_USER: ${WAZUH_INDEXER_USER:-admin}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
      WAZUH_VERIFY_TLS: ${WAZUH_VERIFY_TLS:-true}
    volumes:
      - ./runtime/ingestion:/app/data
    networks:
      - backend_net
      - socdss_net
    restart: unless-stopped

  #################################################
  # MCP COLLECTOR SERVER
  #################################################

  collector_server:
    build:
      context: ./mcp_servers/collector_server
      dockerfile: Dockerfile
    container_name: mcp_collector_server
    networks:
      - backend_net
    ports:
      - "8101:8000"
    volumes:
      - /home/kali/my-lab/infra/volumes/shared_logs/dvwa:/shared_logs:ro

    restart: unless-stopped

  #################################################
  # MCP TRANSLATOR SERVER
  #################################################

  translator_server:
    build:
      context: ./mcp_servers/translator_server
      dockerfile: Dockerfile
    container_name: mcp_translator_server
    networks:
      - backend_net
    ports:
      - "8102:8000"
    restart: unless-stopped

  #################################################
  # MCP CORRELATOR SERVER
  #################################################

  correlator_server:
    build:
      context: ./mcp_servers/correlator_server
      dockerfile: Dockerfile
    container_name: mcp_correlator_server
    networks:
      - backend_net
    ports:
      - "8103:8000"
    restart: unless-stopped

  #################################################
  # MCP REASONING SERVER
  #################################################

  reasoning_server:
    build:
      context: ./mcp_servers/reasoning_server
      dockerfile: Dockerfile
    container_name: mcp_reasoning_server
    networks:
      - backend_net
    ports:
      - "8104:8000"
    environment:
      - AI_PROVIDER=
      - AI_API_KEY=

    restart: unless-stopped

  #################################################
  # MCP RESPONSE SERVER
  #################################################

  response_server:
    build:
      context: ./mcp_servers/response_server
      dockerfile: Dockerfile
    container_name: mcp_response_server
    networks:
      - backend_net
    ports:
      - "8105:8000"
    environment:
      ACTION_APPROVAL_SECRET: ${ACTION_APPROVAL_SECRET:-change-this-development-secret-32-characters}
      SOAR_EXECUTION_MODE: ${SOAR_EXECUTION_MODE:-dry-run}
      SOAR_ACTION_ALLOWLIST: ${SOAR_ACTION_ALLOWLIST:-temporary_ip_block,rate_limit_ip,session_invalidation,increase_monitoring,create_ticket}
      SOAR_AUTO_ACTION_ALLOWLIST: ${SOAR_AUTO_ACTION_ALLOWLIST:-rate_limit_ip,increase_monitoring,create_ticket}
      SOAR_ACTION_WEBHOOK_URL: ${SOAR_ACTION_WEBHOOK_URL:-}
      SOAR_ACTION_WEBHOOK_TOKEN: ${SOAR_ACTION_WEBHOOK_TOKEN:-}
    volumes:
      - ./runtime/response:/app/data
    restart: unless-stopped

  #################################################
  # HOST ORCHESTRATOR
  #################################################

  soar_host:
    build:
      context: ./mcp_host
      dockerfile: Dockerfile
    container_name: mcp_soar_host
    networks:
      - backend_net
      - socdss_net
    depends_on:
      - collector_server
      - translator_server
      - correlator_server
      - reasoning_server
      - response_server
    environment:
      SOAR_KAFKA_ENABLED: ${SOAR_KAFKA_ENABLED:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      SOAR_TENANT_ID: ${SOAR_TENANT_ID:-lab}
    restart: unless-stopped

networks:
  backend_net:
    external: true
  socdss_net:
    external: true
    name: socdss-net
