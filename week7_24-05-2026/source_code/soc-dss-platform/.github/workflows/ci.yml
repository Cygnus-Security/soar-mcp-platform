name: Docker Image CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: soc-dss-platform-backend
      FRONTEND_IMAGE: soc-dss-platform-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set Docker tag
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            echo "TAG=latest" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "TAG=main" >> "$GITHUB_ENV"
          fi

      - name: Build backend image
        run: |
          docker build \
            -t "${REGISTRY}/${IMAGE_OWNER}/${BACKEND_IMAGE}:${TAG}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t "${REGISTRY}/${IMAGE_OWNER}/${FRONTEND_IMAGE}:${TAG}" \
            ./frontend

      - name: Push backend image
        run: |
          docker push "${REGISTRY}/${IMAGE_OWNER}/${BACKEND_IMAGE}:${TAG}"

      - name: Push frontend image
        run: |
          docker push "${REGISTRY}/${IMAGE_OWNER}/${FRONTEND_IMAGE}:${TAG}"
